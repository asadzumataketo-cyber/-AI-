name: Keiba feedback loop

on:
  schedule:
    # UTC odd hours -> JST even hours, at :20 (00:20, 02:20, ... 22:20).
    - cron: '20 1-23/2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: keiba-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize failure-safe report
        run: python3 scripts/ci_feedback.py init
      - name: Set up Python 3.11
        id: setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package and run pytest
        id: tests
        run: python scripts/ci_feedback.py run
      - name: Finalize JSON and Actions summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          RUN_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 scripts/ci_feedback.py finalize --setup-outcome "$SETUP_OUTCOME" --run-outcome "$RUN_OUTCOME"
      - name: Save feedback and compact logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keiba-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            outputs/feedback-latest.json
            outputs/install.log
            outputs/pytest.log
            outputs/pytest.xml

  issue-feedback:
    # A separate job handles comments; pull-request code never gets a write token.
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keiba-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: feedback
      - name: Comment on Issue 15 only when state or commit changes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('feedback/feedback-latest.json', 'utf8'));
            const marker = '<!-- keiba-feedback-loop:v1 -->';
            const state = `<!-- state:${r.commit_sha}:${r.status} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: 15, per_page: 100
            });
            const previous = comments.reverse().find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (previous && previous.body.includes(state)) {
              core.info('State and commit unchanged; no duplicate comment.');
              return;
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 15,
              body: `${marker}\n${state}\nPhase 1 pytest: **${r.status}**\n\n` +
                `Commit: \`${r.commit_sha}\`\n${r.summary}\n\n` +
                `Blockers: ${(r.blockers || []).join(', ') || 'none'}\n\n` +
                `[Actions result / JSON / logs](${url})\n\n` +
                'Repository tests only. No real-race data or paid AI API; no automatic code changes.'
            });
